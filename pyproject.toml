[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tatewari"
version = "0.1.0"
description = "Demonstrate four covert egress channels against a shirudo-style kernel-obs observer, using the spar implementation."
readme = "README.md"
requires-python = ">=3.11,<3.15"
# spar is installed from the sibling checkout, not PyPI:
#   pip install -e ../spar   (branch feat/shirudo-egress-evasion)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tatewari = "tatewari.covert_egress:main"
tatewari-pipeline = "tatewari.evidence_pipeline:main"

[tool.setuptools.packages.find]
include = ["tatewari*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
