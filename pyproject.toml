[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tatewari"
version = "0.1.0"
description = "Covert egress and evidence-plane demonstrations against shirudo's kernel-obs observer: four channels past a metadata-only record, ten scenarios against the record itself, judged on a model and on a real target."
readme = "README.md"
requires-python = ">=3.11,<3.15"
# spar is installed from the sibling checkout, not PyPI:
#   pip install -e ../spar   (branch feat/shirudo-egress-evasion)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17"]

[project.scripts]
tatewari = "tatewari.covert_egress:main"
tatewari-pipeline = "tatewari.evidence_pipeline:main"

[tool.setuptools.packages.find]
include = ["tatewari*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle imports
    "E7",   # pycodestyle statements
    "E9",   # pycodestyle runtime
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "ISC",  # implicit string concat
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# scripts insert the repo root into sys.path before importing
"live/probe_target.py" = ["E402"]
"observed/probe_dns.py" = ["E402"]
